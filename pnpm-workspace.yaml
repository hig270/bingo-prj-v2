packages:
  - apps/*
  - packages/*

# 公開から3日（4320分）たっていないバージョンは入れない（サプライチェーン攻撃の対策）。
# 緊急のセキュリティ修正だけは minimumReleaseAgeExclude に一時的に書いて入れる。
minimumReleaseAge: 4320

# 複数のパッケージで使うライブラリのバージョンを1か所で揃える。
# 各パッケージの package.json では "catalog:" と書いて参照する。
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.0
  fast-check: ^4.0.0
  zod: ^4.0.0
  wrangler: ^4.160.1
  hono: ^4.13.18

# インストール時にビルドスクリプトの実行を許可するパッケージ（ここに書いたもの以外は実行しない）
allowBuilds:
  esbuild: true # ビルド道具（Wrangler・Vite が使う）
  workerd: true # Cloudflare Workers の実行環境（手元での実行・テストに使う）
  # ファイル監視（sass が使う）。配布済みのバイナリが無い環境向けの予備のビルドなので実行しない
  "@parcel/watcher": false
